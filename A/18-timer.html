 <!-- JS -->
 <script>

  /*⭐⭐⭐*/

  /*🚀 Start*/

  let minutes = +prompt("enter minutes");
  let second = +prompt("enter second");

  const timer = setInterval(() => {
    
    
     if (second === -1) {
      minutes--;
      second = 59;
     }
     if (second === 0 && minutes === 0) {
       clearInterval(timer);
       alert("Finish");
    }

    console.log(`Timer : ${minutes} : ${second}`);
    second--;

    

  },1000)


 </script>
