<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>While Loop</title>
</head>
<body>
  
  <script>

    //⭐⭐⭐

    let userNumber = prompt("Please a number: ", 0);
    console.log("User Number: " + userNumber)
    let sum = 0;
    let counter = 0;

    if(isNaN(userNumber)) {
      alert("Invalid Input.");
    }
    else if (userNumber === null) {
      alert("Empty Input.");
    }
    else {
      /*🔃*/
      while((userNumber / 10) !== 0) {
        sum += (userNumber % 10);
        userNumber = Math.floor(userNumber / 10);
        counter++;
      }
    }

    /* 🚩 */  
    console.log("Number Of Character: " + counter + "\n" + "Sum Of Digits: " + sum);

  </script>

</body>
</html>
