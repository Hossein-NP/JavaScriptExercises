<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Total Digits</title>
</head>
<body>
  
  <script>

    //⭐⭐⭐

    const digit = prompt('Enter a number: ');
    let sum = 0;
    let counter = 0;

    function totalDigits(value) {

      if (value === null) {
        return "Canceled";
      }

      else if (value.trim() === "") {
        return "Empty Input";
      }

      else if (isNaN(value)) {
        return "The input value must be the number.";
      }

      else if (value <= 0 || value >= 0) {
        value = Math.abs(value);
        console.log("value: " + value);
        for(let i = 0; (value / 10) !== 0; i++) {
          counter++;
          // 📝 console.log("Value: " + value);
          let digits = value % 10;
          sum += digits;
          value = Math.floor(value / 10);
          // 📝 console.log("counter: " + counter);
        }
      }

      return console.log("Number Of Character: " + counter + "\n" + "Sum Of Digits: " + sum);
    }

    let result = totalDigits(digit);
    /* 🚩 */ console.log(result)


  </script>

</body>
</html>
