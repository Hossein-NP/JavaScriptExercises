<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Average</title>
</head>
<body>
  

  <script>

    //⭐

    let i = 0;
    let sum = 0;
    let numbers;

    for(;i < 5; i++) {
      numbers = +prompt('Enter number: ');
      sum += numbers;
    }

    // console.log(i)
    const avg = sum / i;
    alert('Average: ' + avg);
  </script>
</body>
</html>
