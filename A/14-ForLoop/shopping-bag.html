<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shopping Bag</title>
</head>
<body>
  

  <script>

    //⭐⭐

    let i = 0;
    let productPrice;
    let totalPrice = 0;
    
    for(;i < 5; i++) {
      productPrice = +prompt('Please enter the price of the ' + (i + 1) +'th ' + 'item:');
      totalPrice += productPrice;
      // console.log(totalPrice);
    }
    alert('Total Price: ' + totalPrice + '$');




  </script>
</body>
</html>
