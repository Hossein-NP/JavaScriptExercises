  <script>

    const websiteUsersInfo = [
      { id : 1, userName : "zahra12", password : "Z@z12", },
      { id : 2, userName : "ali net", password : "bistBitan00", },
      { id : 3, userName : "saman kk", password : "samAnmn", },
      { id : 4, userName : "zero", password : "shad0w#%", },
    ];

    //Receive Username:.....
    const inputUserName = prompt("Please enter your username:");

    //Finding the user’s password
    function findPass(user) {

      while (user === null || user.trim() === "") {
        alert("Username cannot be empty");
        user = prompt("Please enter your username:");
      }
      
      const validUserName = websiteUsersInfo.find(function(findUser) {
        return findUser.userName === user;
      });

      if (validUserName === undefined) {
        alert("Username not exist!");
        return null;
      }else {
        alert("Your password is " + validUserName.password);
        return validUserName.password;
      }

    }

  const outPut = findPass(inputUserName);
