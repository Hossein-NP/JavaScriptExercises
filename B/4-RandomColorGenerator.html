<body class="h-screen flex items-center justify-center bg-emerald-200 font-mono transition-all">

  <section class="flex flex-col justify-center items-center gap-5">

    <h1 class="text-3xl font-bold">Random Color Generator</h1>

    <div class="color-card  bg-white rounded-lg w-60 h-70 flex flex-col justify-center items-center gap-2">

      <div class="color-box shadow-2xl w-50 h-50 rounded-md bg-emerald-200"></div>

      <code class="color-code">rgb(164, 244, 207)</code>

    </div>

    <div class="buttons flex gap-6">

      <button class="generate-btn flex items-center gap-2 bg-emerald-600 px-2 py-1 cursor-pointer rounded-lg text-white inset-ring-2 inset-ring-emerald-700">

        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-4 size">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15"></path>
        </svg>

        <span>Generate</span>

      </button>
      <button class="copy-btn flex items-center gap-2 bg-blue-600 px-2 py-1 cursor-pointer rounded-lg text-white inset-ring-2 inset-ring-blue-700">

        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-4">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 12h3.75M9 15h3.75M9 18h3.75m3 .75H18a2.25 2.25 0 0 0 2.25-2.25V6.108c0-1.135-.845-2.098-1.976-2.192a48.424 48.424 0 0 0-1.123-.08m-5.801 0c-.065.21-.1.433-.1.664 0 .414.336.75.75.75h4.5a.75.75 0 0 0 .75-.75 2.25 2.25 0 0 0-.1-.664m-5.8 0A2.251 2.251 0 0 1 13.5 2.25H15c1.012 0 1.867.668 2.15 1.586m-5.8 0c-.376.023-.75.05-1.124.08C9.095 4.01 8.25 4.973 8.25 6.108V8.25m0 0H4.875c-.621 0-1.125.504-1.125 1.125v11.25c0 .621.504 1.125 1.125 1.125h9.75c.621 0 1.125-.504 1.125-1.125V9.375c0-.621-.504-1.125-1.125-1.125H8.25ZM6.75 12h.008v.008H6.75V12Zm0 3h.008v.008H6.75V15Zm0 3h.008v.008H6.75V18Z"></path>
        </svg>

        <span>Copy</span>

      </button>

    </div>

  </section>

 <!-- JS -->
 <script>

  const generateBtn = document.querySelector(".generate-btn");
  const colorBox = document.querySelector(".color-box");
  const colorCode = document.querySelector(".color-code");
  const copyBtn = document.querySelector(".copy-btn");
  const body = document.querySelector("body");


  generateBtn.addEventListener("click", () => {

    const redCode = Math.floor(Math.random() * 255);
    const greenCode = Math.floor(Math.random() * 255);
    const blueCode = Math.floor(Math.random() * 255);

    colorCode.textContent = `rgb(${redCode}, ${greenCode}, ${blueCode})`;
    colorBox.style.backgroundColor = `rgb(${redCode}, ${greenCode}, ${blueCode})`;
    body.style.backgroundColor = `rgb(${redCode}, ${greenCode}, ${blueCode})`;

  })

 </script>

</body>
